name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Source checks
        run: sh Scripts/static-checks.sh
      - name: Unit and UI tests
        run: |
          xcodebuild test \
            -project ConfessionTracker.xcodeproj \
            -scheme ConfessionTracker \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO
      - name: Release build
        run: |
          xcodebuild build \
            -project ConfessionTracker.xcodeproj \
            -scheme ConfessionTracker \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO
      - name: Binary checks
        run: |
          app=$(find ~/Library/Developer/Xcode/DerivedData -path '*Release-iphonesimulator/ConfessionTracker.app' -type d | head -1)
          sh Scripts/static-checks.sh "$app"
